{% extends "base.html" %}
{% block title %}Logowanie — {{ site_name }}{% endblock %}
{% block auth %}
<section class="card">
  <h1>Zaloguj się</h1>
  <p class="muted">Strefa wymiany plików dla klientów BSK Media.</p>
  <form method="post" action="/login" class="stack mt">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Login <input name="username" autocomplete="username" required autofocus></label>
    <label>Hasło <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">{{ ui.icon("lock") }}Zaloguj</button>
  </form>
  <p class="muted small center">Nie masz konta? Konta zakłada administrator BSK Media.</p>
</section>
{% endblock %}
