# BSK Media Cloud na Ugreen NAS (UGOS Pro, aplikacja Docker).
# Uruchomienie:  docker compose up -d --build
# Z tunelem Cloudflare zamiast przekierowania portów:  docker compose --profile tunnel up -d --build
services:
  app:
    build:
      context: ./server
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-10}
    container_name: bsk-cloud
    restart: unless-stopped
    env_file: .env
    environment:
      BSK_DATA_DIR: /data
      BSK_DB_DIR: /baza
      BSK_BACKUP_DIR: /kopia
    volumes:
      # Pliki klientów, kopie pracowników, linki — duży dysk (HDD)
      - ${BSK_DATA_FOLDER:-/volume2/bsk-dane}:/data
      # Baza danych portalu — szybki dysk (SSD)
      - ${BSK_DB_FOLDER:-/volume1/bsk-cloud/baza}:/baza
      # Codzienna kopia bazy i plików klientów — drugi dysk (SSD 1 TB)
      - ${BSK_BACKUP_FOLDER:-/volume2/bsk-kopie}:/kopia
    ports:
      # Dostęp w sieci firmowej (np. http://192.168.1.50:8090) — przydaje się do testów
      # i dla agentów kopii w biurze. Usuń, jeśli nie potrzebujesz.
      - "8090:8000"

  # Tylko wariant z przekierowaniem portów (bez tunelu): docker compose --profile direct up -d
  caddy:
    image: caddy:2
    container_name: bsk-caddy
    profiles: [direct]
    restart: unless-stopped
    depends_on: [app]
    environment:
      BSK_DOMAIN: ${BSK_DOMAIN:-cloud.bskmedia.pl}
    ports:
      # Na routerze przekieruj: zewnętrzny 80 -> NAS:8880, zewnętrzny 443 -> NAS:8443
      - "8880:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Edycja dokumentów online (Excel/Word/PowerPoint) ze współpracą na żywo — ONLYOFFICE Docs.
  # Uruchom z profilem "office"; edytor jest dostępny pod https://cloud.bskmedia.pl/office
  office:
    image: onlyoffice/documentserver:latest
    container_name: bsk-office
    profiles: [office]
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${BSK_OFFICE_SECRET:-}
      # serwer dokumentów pobiera pliki z portalu w wewnętrznej sieci Dockera
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - ${BSK_OFFICE_FOLDER:-/volume1/bsk-cloud/office}/data:/var/www/onlyoffice/Data
      - ${BSK_OFFICE_FOLDER:-/volume1/bsk-cloud/office}/lib:/var/lib/onlyoffice
      - ${BSK_OFFICE_FOLDER:-/volume1/bsk-cloud/office}/logs:/var/log/onlyoffice

  # Rozdzielacz za tunelem: cloud.bskmedia.pl/office -> edytor dokumentów, reszta -> portal.
  # W Cloudflare trasa cloud.bskmedia.pl musi wskazywać na: HTTP  gateway:80
  gateway:
    image: caddy:2
    container_name: bsk-gateway
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro

  # Tryb biurowy: HTTPS w sieci lokalnej pod tym samym adresem (lokalny DNS: cloud.bskmedia.pl -> BSK_LAN_IP).
  # Kontener ma WŁASNY adres w sieci biurowej (macvlan), bo port 443 samego NAS zajmuje system UGOS.
  # Wymaga CLOUDFLARE_API_TOKEN (Zone:DNS:Edit dla bskmedia.pl) — certyfikat bez otwierania portów.
  lan:
    build: ./lan
    container_name: bsk-lan
    profiles: [lan]
    restart: unless-stopped
    depends_on: [app]
    environment:
      BSK_DOMAIN: ${BSK_DOMAIN:-cloud.bskmedia.pl}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    networks:
      default: {}
      biuro:
        ipv4_address: ${BSK_LAN_IP:-192.168.10.250}
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - lan_data:/data
      - lan_config:/config

  # Alternatywa dla przekierowania portów (np. gdy operator daje CGNAT / brak publicznego IP).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bsk-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app, gateway]

volumes:
  caddy_data:
  caddy_config:
  lan_data:
  lan_config:

networks:
  # Sieć biurowa dla trybu "lan" (tworzona tylko przy tym profilu). Adres BSK_LAN_IP musi być wolny
  # i zarezerwowany w routerze, żeby DHCP nie dał go innemu urządzeniu.
  biuro:
    driver: macvlan
    driver_opts:
      parent: ${BSK_LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${BSK_LAN_SUBNET:-192.168.10.0/24}
          gateway: ${BSK_LAN_GATEWAY:-192.168.10.1}
          ip_range: ${BSK_LAN_IP:-192.168.10.250}/32
